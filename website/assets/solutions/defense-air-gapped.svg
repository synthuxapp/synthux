<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <radialGradient id="glowDef" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridDef" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="#09090b"/>
  <rect width="640" height="360" fill="url(#gridDef)"/>
  <rect width="640" height="360" fill="url(#glowDef)"/>

  <!-- Air-Gapped Hardware Perimeter Dashed Frame -->
  <rect x="28" y="24" width="584" height="312" rx="18" fill="#0c0c10" fill-opacity="0.85" stroke="#22c55e" stroke-opacity="0.55" stroke-width="1.75" stroke-dasharray="8 6"/>

  <!-- Top Security Pill -->
  <rect x="52" y="44" width="268" height="32" rx="8" fill="#111827" stroke="#22c55e" stroke-opacity="0.5"/>
  <circle cx="70" cy="60" r="5" fill="#22c55e"/>
  <text x="84" y="65" fill="#4ade80" font-family="SF Mono, Inter, monospace" font-size="12.5" font-weight="700">AIR-GAPPED · 127.0.0.1 ONLY</text>

  <!-- Right Egress Counter Pill -->
  <rect x="424" y="44" width="164" height="32" rx="8" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.4"/>
  <text x="442" y="65" fill="#fafafa" font-family="Inter, sans-serif" font-size="13" font-weight="800">0 Bytes Cloud Egress</text>

  <!-- Left Node: Classified Intranet / C4ISR UI -->
  <rect x="52" y="96" width="232" height="168" rx="14" fill="#121217" stroke="#27272a" stroke-width="1.5"/>
  <rect x="70" y="114" width="96" height="24" rx="6" fill="#3b82f6" fill-opacity="0.15"/>
  <text x="82" y="130" fill="#60a5fa" font-family="SF Mono, monospace" font-size="11.5" font-weight="700">INTRANET UI</text>
  <text x="70" y="164" fill="#fafafa" font-family="Inter, sans-serif" font-size="17" font-weight="800">C4ISR &amp; Core Banking</text>
  <text x="70" y="188" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13">• DOM &amp; Contrast Scan</text>
  <text x="70" y="210" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13">• Cognitive Load Check</text>
  <text x="70" y="232" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13">• Custom HMI JSON Rules</text>

  <!-- Bidirectional Loopback Bridge -->
  <line x1="284" y1="180" x2="356" y2="180" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="5 4"/>
  <circle cx="320" cy="180" r="16" fill="#111827" stroke="#22c55e" stroke-width="2"/>
  <path d="M315 180l3 3 7-7" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Node: On-Device Ollama Engine -->
  <rect x="356" y="96" width="232" height="168" rx="14" fill="#121217" stroke="#3b82f6" stroke-width="1.75"/>
  <rect x="374" y="114" width="128" height="24" rx="6" fill="#22c55e" fill-opacity="0.15"/>
  <text x="386" y="130" fill="#4ade80" font-family="SF Mono, monospace" font-size="11.5" font-weight="700">ON-DEVICE AI</text>
  <text x="374" y="164" fill="#fafafa" font-family="Inter, sans-serif" font-size="17" font-weight="800">Local Ollama Runtime</text>
  <text x="374" y="188" fill="#d4d4d8" font-family="SF Mono, monospace" font-size="12.5">gemma4 · qwen3.8</text>
  <text x="374" y="210" fill="#d4d4d8" font-family="SF Mono, monospace" font-size="12.5">llama4:scout · deepseek</text>
  <text x="374" y="234" fill="#60a5fa" font-family="Inter, sans-serif" font-size="12.5" font-weight="600">localhost:11434 (Offline)</text>

  <!-- Bottom Bar: Audit Deliverable -->
