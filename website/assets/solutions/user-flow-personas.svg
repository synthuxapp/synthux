  <text x="208" y="188" fill="#FDE68A" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600">Tier Jargon Drift</text>

  <line x1="328" y1="151" x2="364" y2="151" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="4 4"/>

  <rect x="364" y="94" width="136" height="114" rx="12" fill="#1A1114" stroke="#EF4444" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="380" y="118" fill="#FCA5A5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700">03 · CHECKOUT</text>
  <text x="380" y="156" fill="#F87171" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="800">58</text>
