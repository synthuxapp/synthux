  <rect x="608" y="406" width="232" height="184" rx="10" fill="#09090b" stroke="#27272a"/>
  <text x="626" y="434" fill="#60a5fa" font-family="SF Mono, monospace" font-size="10" font-weight="700">PERSONA 03</text>
