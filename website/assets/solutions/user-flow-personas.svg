<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <pattern id="dotsFlow" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="#09090b"/>
  <rect width="640" height="360" fill="url(#dotsFlow)"/>

  <rect x="28" y="24" width="584" height="312" rx="18" fill="#101014" fill-opacity="0.92" stroke="#27272a" stroke-width="1.5"/>

  <!-- Header -->
  <text x="52" y="58" fill="#fafafa" font-family="Inter, sans-serif" font-size="16" font-weight="800">Multi-Page Flow Builder</text>
  <rect x="422" y="38" width="166" height="30" rx="8" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.45"/>
  <text x="438" y="58" fill="#60a5fa" font-family="SF Mono, monospace" font-size="12.5" font-weight="700">FLOW SCORE: 91/100</text>

  <!-- 3 Connected Page Nodes -->
  <rect x="52" y="84" width="156" height="104" rx="12" fill="#16161c" stroke="#22c55e" stroke-width="1.75"/>
  <text x="70" y="112" fill="#a1a1aa" font-family="SF Mono, monospace" font-size="11.5" font-weight="700">STEP 01</text>
  <text x="70" y="138" fill="#fafafa" font-family="Inter, sans-serif" font-size="16" font-weight="800">Landing</text>
  <text x="70" y="168" fill="#4ade80" font-family="Inter, sans-serif" font-size="15" font-weight="800">Score: 94</text>

  <line x1="208" y1="136" x2="242" y2="136" stroke="#3b82f6" stroke-width="2.5"/>

  <rect x="242" y="84" width="156" height="104" rx="12" fill="#16161c" stroke="#3b82f6" stroke-width="1.75"/>
  <text x="260" y="112" fill="#a1a1aa" font-family="SF Mono, monospace" font-size="11.5" font-weight="700">STEP 02</text>
  <text x="260" y="138" fill="#fafafa" font-family="Inter, sans-serif" font-size="16" font-weight="800">Pricing</text>
  <text x="260" y="168" fill="#60a5fa" font-family="Inter, sans-serif" font-size="15" font-weight="800">Score: 88</text>

  <line x1="398" y1="136" x2="432" y2="136" stroke="#f59e0b" stroke-width="2.5"/>

  <rect x="432" y="84" width="156" height="104" rx="12" fill="#16161c" stroke="#f59e0b" stroke-width="1.75"/>
  <text x="450" y="112" fill="#a1a1aa" font-family="SF Mono, monospace" font-size="11.5" font-weight="700">STEP 03</text>
  <text x="450" y="138" fill="#fafafa" font-family="Inter, sans-serif" font-size="16" font-weight="800">Sign-Up</text>
  <text x="450" y="168" fill="#fbbf24" font-family="Inter, sans-serif" font-size="15" font-weight="800">Score: 76</text>

  <!-- Synthetic Personas Bar -->
  <rect x="52" y="208" width="536" height="106" rx="12" fill="#16161c" stroke="#27272a" stroke-width="1.5"/>
  <text x="72" y="236" fill="#60a5fa" font-family="SF Mono, monospace" font-size="12" font-weight="700">SYNTHETIC USER PERSONAS (3 BUILT-IN + 5 CUSTOM)</text>

  <rect x="72" y="252" width="154" height="44" rx="8" fill="#09090b" stroke="#27272a"/>
  <text x="88" y="279" fill="#fafafa" font-family="Inter, sans-serif" font-size="13.5" font-weight="700">First-Time Visitor</text>

  <rect x="242" y="252" width="144" height="44" rx="8" fill="#09090b" stroke="#27272a"/>
  <text x="268" y="279" fill="#fafafa" font-family="Inter, sans-serif" font-size="13.5" font-weight="700">Power User</text>

  <rect x="402" y="252" width="166" height="44" rx="8" fill="#09090b" stroke="#3b82f6" stroke-opacity="0.6"/>
  <text x="422" y="279" fill="#60a5fa" font-family="Inter, sans-serif" font-size="13.5" font-weight="700">+ Custom Personas</text>
</svg>
