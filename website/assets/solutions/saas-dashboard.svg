<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <radialGradient id="glowSaas" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridSaas" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="#09090b"/>
  <rect width="640" height="360" fill="url(#gridSaas)"/>
  <rect width="640" height="360" fill="url(#glowSaas)"/>

  <rect x="32" y="24" width="576" height="312" rx="18" fill="#101014" stroke="#27272a" stroke-width="1.5"/>

  <!-- Top Bar -->
  <rect x="56" y="44" width="164" height="34" rx="8" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.4"/>
  <text x="72" y="66" fill="#60a5fa" font-family="SF Mono, monospace" font-size="12.5" font-weight="700">PACK: SAAS.JSON</text>

  <rect x="436" y="44" width="148" height="34" rx="8" fill="#22c55e" fill-opacity="0.14" stroke="#22c55e" stroke-opacity="0.45"/>
  <text x="454" y="66" fill="#4ade80" font-family="Inter, sans-serif" font-size="15" font-weight="800">UX Score: 89/100</text>

  <!-- 2-Column Cards: Empty State Onboarding + Power User Shortcuts -->
  <rect x="56" y="96" width="254" height="126" rx="12" fill="#16161c" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="76" y="124" fill="#60a5fa" font-family="SF Mono, monospace" font-size="11.5" font-weight="700">ONBOARDING UX</text>
  <text x="76" y="152" fill="#fafafa" font-family="Inter, sans-serif" font-size="16.5" font-weight="800">Actionable Empty State</text>
  <text x="76" y="176" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13">Starter template + primary</text>
  <text x="76" y="196" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13">CTA prevents user drop-off</text>

  <rect x="330" y="96" width="254" height="126" rx="12" fill="#16161c" stroke="#27272a" stroke-width="1.5"/>
  <text x="350" y="124" fill="#4ade80" font-family="SF Mono, monospace" font-size="11.5" font-weight="700">POWER USER</text>
  <text x="350" y="152" fill="#fafafa" font-family="Inter, sans-serif" font-size="16.5" font-weight="800">Bulk Actions &amp; Hotkeys</text>
  <rect x="350" y="168" width="68" height="28" rx="6" fill="#09090b" stroke="#3f3f46"/>
  <text x="362" y="187" fill="#fafafa" font-family="SF Mono, monospace" font-size="12.5" font-weight="700">⌘ + K</text>
  <text x="430" y="187" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13">Batch selection ✓</text>

  <!-- Bottom Card: Destructive Action & RBAC Guardrails -->
  <rect x="56" y="238" width="528" height="76" rx="12" fill="#16161c" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="76" y="266" fill="#fafafa" font-family="Inter, sans-serif" font-size="16" font-weight="800">Data Density &amp; Destructive Action Guardrails</text>
  <text x="76" y="292" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13.5">Audits table scanability, RBAC permission clarity &amp; delete confirmation</text>
  <rect x="488" y="256" width="76" height="32" rx="7" fill="#22c55e" fill-opacity="0.15"/>
  <text x="507" y="277" fill="#4ade80" font-family="SF Mono, monospace" font-size="12.5" font-weight="700">VERIFIED</text>
</svg>
