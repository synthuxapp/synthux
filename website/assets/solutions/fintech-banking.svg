  <text x="736" y="182" fill="#fafafa" font-family="Inter, sans-serif" font-size="22" font-weight="800">Fintech UX Score: 92/100</text>

  <rect x="736" y="208" width="334" height="72" rx="10" fill="#09090b" stroke="#27272a"/>
  <text x="754" y="234" fill="#e4e4e7" font-family="Inter, sans-serif" font-size="12.5" font-weight="700">1. Numeric &amp; IBAN Input Masking</text>
  <text x="754" y="256" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11.5">4-character chunking prevents transposition errors</text>

  <rect x="736" y="294" width="334" height="72" rx="10" fill="#09090b" stroke="#27272a"/>
  <text x="754" y="320" fill="#e4e4e7" font-family="Inter, sans-serif" font-size="12.5" font-weight="700">2. Fee &amp; FX Spread Disclosure</text>
  <text x="754" y="342" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11.5">Pre-commit net amount &amp; rate lock timer visible</text>

  <rect x="736" y="380" width="334" height="72" rx="10" fill="#09090b" stroke="#27272a"/>
  <text x="754" y="406" fill="#e4e4e7" font-family="Inter, sans-serif" font-size="12.5" font-weight="700">3. Irreversible Transaction Friction</text>
  <text x="754" y="428" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11.5">Explicit finality notice + secondary review path</text>

  <rect x="736" y="472" width="334" height="64" rx="10" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-opacity="0.35"/>
  <text x="754" y="498" fill="#4ade80" font-family="SF Mono, monospace" font-size="11" font-weight="700">PCI-DSS / GDPR SAFE AUDITING</text>
  <text x="754" y="518" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11">Run locally via Ollama or BYOK direct API</text>
</svg>
