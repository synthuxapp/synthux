  <text x="456" y="242" fill="#fafafa" font-family="SF Mono, monospace" font-size="18" font-weight="800">$24,500.00 USD</text>
  <circle cx="614" cy="150" r="13" fill="#3b82f6"/>
  <text x="610" y="154" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="800">1</text>

