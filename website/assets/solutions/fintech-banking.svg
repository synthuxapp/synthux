  <text x="454" y="67" fill="#4ade80" font-family="Inter, sans-serif" font-size="16" font-weight="800">UX Score: 92/100</text>

  <!-- Audit Row 1: IBAN & Numeric Formatting -->
  <rect x="56" y="94" width="528" height="68" rx="12" fill="#16161c" stroke="#27272a"/>
  <circle cx="88" cy="128" r="14" fill="#22c55e" fill-opacity="0.18"/>
  <path d="M82 128l4 4 8-8" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="116" y="123" fill="#fafafa" font-family="Inter, sans-serif" font-size="15.5" font-weight="700">IBAN &amp; Numeric Input Masking</text>
  <text x="116" y="145" fill="#a1a1aa" font-family="SF Mono, monospace" font-size="13">DE89 3704 0044 0532 · 4-char chunking</text>
  <rect x="492" y="114" width="72" height="28" rx="6" fill="#22c55e" fill-opacity="0.15"/>
  <text x="511" y="133" fill="#4ade80" font-family="SF Mono, monospace" font-size="12.5" font-weight="700">PASS</text>

  <!-- Audit Row 2: Fee & Exchange Rate Transparency -->
  <rect x="56" y="174" width="528" height="68" rx="12" fill="#16161c" stroke="#27272a"/>
  <circle cx="88" cy="208" r="14" fill="#22c55e" fill-opacity="0.18"/>
  <path d="M82 208l4 4 8-8" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="116" y="203" fill="#fafafa" font-family="Inter, sans-serif" font-size="15.5" font-weight="700">Pre-Commit Fee &amp; FX Spread Clarity</text>
  <text x="116" y="225" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13">Net recipient amount + rate lock timer visible</text>
  <rect x="492" y="194" width="72" height="28" rx="6" fill="#22c55e" fill-opacity="0.15"/>
  <text x="511" y="213" fill="#4ade80" font-family="SF Mono, monospace" font-size="12.5" font-weight="700">PASS</text>

  <!-- Audit Row 3: Irreversible Transaction Guardrail -->
  <rect x="56" y="254" width="528" height="64" rx="12" fill="#16161c" stroke="#f59e0b" stroke-opacity="0.65" stroke-width="1.5"/>
  <circle cx="88" cy="286" r="14" fill="#f59e0b" fill-opacity="0.2"/>
  <text x="84" y="292" fill="#fbbf24" font-family="Inter, sans-serif" font-size="15" font-weight="800">!</text>
  <text x="116" y="281" fill="#fafafa" font-family="Inter, sans-serif" font-size="15.5" font-weight="700">Irreversible Settlement Warning</text>
  <text x="116" y="303" fill="#fcd34d" font-family="Inter, sans-serif" font-size="13">Explicit finality notice before wire signature</text>
  <rect x="476" y="272" width="88" height="28" rx="6" fill="#f59e0b" fill-opacity="0.18"/>
  <text x="491" y="291" fill="#fbbf24" font-family="SF Mono, monospace" font-size="12" font-weight="700">GUARDED</text>
