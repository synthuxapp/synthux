<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>synthux — Flow Builder 2.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Primary Toolbar -->
  <div id="toolbar" class="toolbar">
    <div class="toolbar__left">
      <img src="../assets/logo.svg" alt="synthux" class="toolbar__logo">
      <span class="toolbar__title">Flow Builder</span>
      <span class="flow-ver-pill">v2.2</span>
    </div>

    <div class="toolbar__center">
      <button id="btn-add-page" class="tb-btn tb-btn--primary" title="Add a page step by URL">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Add Page</span>
      </button>
      <button id="btn-pin-tab" class="tb-btn" title="Pin currently active browser tab">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        <span>Pin Tab</span>
      </button>

      <div class="tb-icon-group">
        <button id="btn-open-tabs" class="tb-btn tb-btn--icon" title="Add steps from open browser tabs">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <line x1="3" y1="10" x2="21" y2="10"></line>
            <line x1="9" y1="4" x2="9" y2="10"></line>
          </svg>
        </button>
        <button id="btn-add-note" class="tb-btn tb-btn--icon" title="Add Sticky Note">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
        </button>
        <button id="btn-auto-layout" class="tb-btn tb-btn--icon" title="Auto-align all steps horizontally">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="6" height="10" rx="1"></rect>
            <rect x="16" y="7" width="6" height="10" rx="1"></rect>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
        </button>
        <button id="btn-clear" class="tb-btn tb-btn--icon tb-btn--hover-danger" title="Clear Canvas">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>

      <div class="tb-sep"></div>

      <div class="tb-icon-group">
        <button id="btn-save" class="tb-btn tb-btn--icon" title="Save Flow">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
        </button>
        <button id="btn-load" class="tb-btn tb-btn--icon tb-btn--with-badge" title="Saved Flows">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          <span id="load-count-badge" class="tb-icon-badge" hidden>0</span>
        </button>
        <button id="btn-export-json" class="tb-btn tb-btn--icon" title="Export Flow JSON">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
        <label class="tb-btn tb-btn--icon" title="Import Flow JSON" style="cursor:pointer;">
          <input id="input-import-json" type="file" accept=".json,application/json" hidden>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
        </label>
      </div>
    </div>

    <div class="toolbar__right">
      <div class="zoom-controls">
        <button id="btn-zoom-out" class="tb-btn tb-btn--icon" title="Zoom Out">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <span id="zoom-level" class="zoom-level">100%</span>
        <button id="btn-zoom-in" class="tb-btn tb-btn--icon" title="Zoom In">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <button id="btn-fit" class="tb-btn tb-btn--icon" title="Fit Canvas to Screen">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
        </button>
      </div>
      <div class="tb-sep"></div>
      <button id="btn-cancel-analyze" class="tb-btn tb-btn--cancel" hidden>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <rect x="5" y="5" width="14" height="14" rx="2"></rect>
        </svg>
        <span>Cancel</span>
      </button>
      <button id="btn-analyze" class="tb-btn tb-btn--accent">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <polygon points="6 4 20 12 6 20 6 4"></polygon>
        </svg>
        <span>Analyze Flow</span>
      </button>
    </div>
  </div>

  <!-- Sub-Toolbar: Rule Pack, Personas & Business Context Bar -->
  <div id="flow-config-bar" class="flow-config-bar">
    <div class="flow-config-group">
      <span class="flow-config-label">Rule Pack</span>
      <select id="flow-rulepack-select" class="flow-config-select">
        <option value="nielsen-10">Nielsen's 10 Heuristics</option>
        <option value="ecommerce">E-Commerce &amp; Conversion</option>
        <option value="saas">SaaS &amp; Web Apps</option>
        <option value="fintech">Fintech &amp; Banking</option>
      </select>
    </div>

    <div class="tb-sep"></div>

    <div class="flow-config-group">
      <span class="flow-config-label">Personas</span>
      <div id="flow-personas-chips" class="flow-chip-row">
        <button type="button" class="flow-chip active" data-profile="first-time">First-Time</button>
        <button type="button" class="flow-chip active" data-profile="power-user">Power User</button>
        <button type="button" class="flow-chip active" data-profile="accessibility">Accessibility</button>
      </div>
    </div>

    <div class="tb-sep"></div>

    <div class="flow-config-group">
      <label class="flow-biz-toggle" title="Include Company, Product Goal, Must-Haves &amp; Department Lenses in Flow Audit">
        <input type="checkbox" id="flow-biz-enabled" class="flow-biz-checkbox">
        <span class="flow-biz-switch"></span>
        <span class="flow-config-label" style="color:var(--sx-text-secondary);">Goal Context</span>
      </label>
      <select id="flow-biz-select" class="flow-config-select">
        <option value="default-context">Default Product Context</option>
      </select>
    </div>
  </div>

  <!-- Canvas -->
  <div id="canvas-viewport" class="canvas-viewport">
    <div id="canvas" class="canvas">
      <!-- SVG connector layer -->
      <svg id="connector-svg" class="connector-svg">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="var(--sx-accent)" />
          </marker>
        </defs>
      </svg>
      <!-- Nodes and notes rendered here -->
    </div>

    <!-- Floating Step & Transition Inspector -->
    <div id="inspector-panel" class="inspector-panel" hidden>
      <div class="inspector-header">
        <span id="inspector-title" class="inspector-title">Step Inspector</span>
        <button id="inspector-close" class="modal__close" style="font-size:16px;">×</button>
      </div>
      <div id="inspector-body" class="inspector-body"></div>
    </div>
  </div>

  <!-- Add Page Popover -->
  <div id="add-page-popover" class="popover" hidden>
    <div class="popover__content">
      <label class="popover__label">Page URL *</label>
      <input id="add-page-url" type="url" class="popover__input" placeholder="https://example.com" autofocus>
      <label class="popover__label" style="margin-top:8px;">Step Label</label>
      <input id="add-page-label" type="text" class="popover__input" placeholder="e.g. Landing Page / Pricing">
      <label class="popover__label" style="margin-top:8px;">Expected Step Goal / Action (optional)</label>
      <input id="add-page-goal" type="text" class="popover__input" placeholder="e.g. Select Pro Plan and click Start Trial">
      <label class="popover__label" style="margin-top:8px;">Step Metric / Drop-Off (optional)</label>
      <input id="add-page-metric" type="text" class="popover__input" placeholder="e.g. Drop-off: 42% · Bounce: 60%">
      <div class="popover__actions">
        <button id="add-page-confirm" class="tb-btn tb-btn--primary">Add Step</button>
        <button id="add-page-cancel" class="tb-btn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Open Browser Tabs Picker Modal -->
  <div id="open-tabs-modal" class="modal-overlay" hidden>
    <div class="modal load-modal">
      <div class="modal__header">
        <span class="modal__title">Add Steps from Open Browser Tabs</span>
        <button id="open-tabs-close" class="modal__close">×</button>
      </div>
      <div id="open-tabs-body" class="modal__body"></div>
      <div class="modal__footer" style="display:flex;justify-content:space-between;align-items:center;">
        <button id="open-tabs-select-all" class="tb-btn">Select All</button>
        <div style="display:flex;gap:8px;">
          <button id="open-tabs-confirm" class="tb-btn tb-btn--accent">Add Selected Tabs</button>
          <button id="open-tabs-cancel" class="tb-btn">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Save Name Popover -->
  <div id="save-popover" class="popover" hidden>
    <div class="popover__content">
      <label class="popover__label">Flow Name</label>
      <input id="save-name-input" type="text" class="popover__input" placeholder="My User Journey">
      <div class="popover__actions">
        <button id="save-confirm" class="tb-btn tb-btn--primary">Save</button>
        <button id="save-cancel" class="tb-btn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Load Flows Modal -->
  <div id="load-modal" class="modal-overlay" hidden>
    <div class="modal load-modal">
      <div class="modal__header">
        <span class="modal__title">Saved Flows</span>
        <button id="load-modal-close" class="modal__close">×</button>
      </div>
      <div id="load-modal-body" class="modal__body">
        <!-- Populated by JS -->
      </div>
      <div class="modal__footer">
        <button id="load-modal-cancel" class="tb-btn">Close</button>
      </div>
    </div>
  </div>

  <!-- Receipt Modal -->
  <div id="receipt-modal" class="modal-overlay" hidden>
    <div class="modal receipt-modal">
      <div class="modal__header">
        <span class="modal__title">Flow Analysis Configuration</span>
        <button id="receipt-close" class="modal__close">×</button>
      </div>
      <div id="receipt-body" class="modal__body">
        <!-- Populated by JS -->
      </div>
      <div class="modal__footer">
        <button id="receipt-start" class="tb-btn tb-btn--accent tb-btn--lg">Start Analysis</button>
        <button id="receipt-cancel" class="tb-btn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Results Panel -->
  <div id="results-panel" class="results-panel" hidden>
    <div class="results-panel__header">
      <span class="results-panel__title">Flow Journey Report</span>
      <button id="results-toggle" class="results-panel__toggle">▼</button>
    </div>
    <div id="results-body" class="results-panel__body">
      <!-- Populated by JS -->
    </div>
  </div>

  <!-- Floating Terminal Log -->
  <div id="flow-terminal" class="flow-terminal" hidden>
    <div class="flow-terminal__header">
      <span class="flow-terminal__title">synthux — flow analysis logs</span>
      <button id="flow-terminal-close" class="flow-terminal__close-btn" hidden>×</button>
    </div>
    <div id="flow-terminal-body" class="flow-terminal__body"></div>
  </div>

  <!-- Status Bar -->
  <div id="status-bar" class="status-bar">
    <span id="status-text">0 pages · Ready</span>
    <span id="status-progress" class="status-bar__progress" hidden></span>
  </div>

  <!-- Scripts -->
  <script src="flow-canvas.js" type="module"></script>
  <script src="flow-toolbar.js" type="module"></script>
  <script src="flow-results-panel.js" type="module"></script>
</body>
</html>
